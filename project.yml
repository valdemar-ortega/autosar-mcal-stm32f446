---
# Configuracion de Ceedling (unit testing con Unity + coverage con gcov/gcovr)
# Ejecuta las pruebas con: make test
:project:
  :build_root: build/ceedling/   # Directorio donde ceedling pondra los archivos generados
  :release_build: FALSE

:paths:
  :test:
    - test/unit/**          # Pruebas que se ejecutan en el equipo anfitrion
  :source:
    - app/**                # Codigo de arranque provisional
    - Bsw/Mcal/*/src/**     # Drivers del MCAL
    - Bsw/Mcal/*/config/**  # Configuracion link-time y post-build
    - Bsw/Services/*/src/** # Servicios del BSW
  :include:
    - app/**
    - Common/Include/**     # Platform_Types, Compiler, Std_Types, MemMap
    - Platform/Device/**    # Mapa de registros del STM32F446
    - Bsw/Mcal/*/include/**
    - Bsw/Services/*/include/**

:defines:
  :test:
    - UTEST      # Simbolo definido solo al compilar las pruebas unitarias

:plugins:
  :load_paths: []
  :enabled:
    - report_tests_pretty_stdout
    - gcov

:gcov:
  :utilities:
    - gcovr
  :report_task: FALSE   # Los reportes se generan automaticamente con gcov:all
  :reports:
    - HtmlDetailed      # Reporte en build/ceedling/artifacts/gcov/
